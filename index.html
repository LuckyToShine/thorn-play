<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Thorn</title>
    <style>
        html, body, canvas {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: absolute;
            background: black;
            z-index: 0;
        }
        canvas { outline: none; }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <script src="gl.js"></script>
    <script>
        load("thorn.wasm");
        window.addEventListener("load", function () {
            document.getElementById("glcanvas").focus();
        });
    </script>
</body>
</html>
