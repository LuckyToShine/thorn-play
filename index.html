<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Thorn</title>
    <!-- logo.png is copied from assets/ by build.sh -->
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            overscroll-behavior: none;
            background: black;
        }
        canvas {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            position: absolute;
            z-index: 0;
            outline: none;
            touch-action: none;
            background: black;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <!-- Plugins must register before load(); bridge.js wraps audio.js's
         imports, so it comes after it. -->
    <script src="gl.js"></script>
    <script src="audio.js"></script>
    <script src="bridge.js"></script>
    <script>
        load("thorn.wasm");
        window.addEventListener("load", function () {
            document.getElementById("glcanvas").focus();
        });
    </script>
</body>
</html>
